services:
  - type: web
    name: social-detect-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /status
    envVars:
      - key: SOCIAL_DETECT_ENVIRONMENT
        value: production

  - type: web
    name: social-detect-dashboard
    runtime: docker
    plan: free
    region: oregon
    rootDir: dashboard
    dockerfilePath: ./dashboard/Dockerfile.render
    dockerContext: ./dashboard
    envVars:
      - key: API_HOST
        fromService:
          name: social-detect-api
          type: web
          property: host
