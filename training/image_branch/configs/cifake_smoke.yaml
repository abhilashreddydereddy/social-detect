name: cifake-smoke
train_manifest: training/data/manifests/cifake_smoke_train.csv
val_manifest: training/data/manifests/cifake_smoke_val.csv
output_dir: training/exports/image_branch/cifake_smoke
checkpoint_name: best_model.pth
backbone: tiny_cnn
